<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickPay</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>

    <main class="quickpay">

        <header>
            <h1 class="animate__animated animate__jackInTheBox">QuickPay</h1>
        <p>Fast. Simple. Secure.</p>
        </header>

        <section class="icons">

        <div class="clock">
            <div class="clock">

    <svg class="clock-svg"
         width="100"
         height="100"
         viewBox="0 0 200 200"
         xmlns="http://www.w3.org/2000/svg">

        <circle
            cx="100"
            cy="100"
            r="90"
            fill="black"
        />

        <polyline
            points="100,55 100,105 65,105"
            fill="none"
            stroke="white"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

    </svg>

    
            <h2>Processing</h2>
        </div>

        <div class="credit-card">
            <img src="Quickpay/images/credit-card.svg" alt="Credit card icon">
            <h2>Payment</h2>
        </div>

    </section>

    <section class="payment-status">
        <h2>Payment Processing</h2>
        <p>Your payment is almost complete.</p>
    </section>

    <button type="button">Continue</button>

    </main>

</body>

</html>
